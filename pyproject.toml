[project]
name = "payshare"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.3",
    "django-cors-headers>=4.9.0",
    "django-filer>=3.4.4",
    "django-money>=3.6.0",
